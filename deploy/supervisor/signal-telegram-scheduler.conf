;[program:signal-telegram-scheduler]
; برای vip:expire و سایر Scheduleهای لاراول
; کپی به: /etc/supervisor/conf.d/signal-telegram-scheduler.conf

[program:signal-telegram-scheduler]
command=/bin/bash -c "while true; do php /var/www/signal-telegram/artisan schedule:run --verbose --no-interaction; sleep 60; done"
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/signal-telegram/storage/logs/scheduler.log
stopwaitsecs=60
